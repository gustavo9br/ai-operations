# Ambiente local completo: n8n + Postgres + Mailpit (caixa de e-mail de teste).
#   docker compose -f docker-compose.dev.yml up -d --build
# n8n:     http://localhost:5678   (crie o usuário dono no primeiro acesso)
# Mailpit: http://localhost:8025   (todos os e-mails enviados pelo workflow caem aqui)
#
# Para rodar SEM chave da OpenAI nem bot do Telegram, suba também os mocks:
#   docker compose -f docker-compose.dev.yml --profile mock up -d --build
# e use `node scripts/seed-credentials.mjs --mock` (veja o README).
services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: n8n
      OPS_APP_PASSWORD: ops_app_dev
      OPS_MEMORIA_PASSWORD: ops_memoria_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ops"]
      interval: 3s
      timeout: 3s
      retries: 30

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.45.5}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      TZ: America/Sao_Paulo
      GENERIC_TIMEZONE: America/Sao_Paulo
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: postgres
      N8N_ENCRYPTION_KEY: dev-only-encryption-key-change-in-prod
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_WEBHOOK_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      # Parâmetros lidos pelo workflow via $env.*
      APROVADOR_TELEGRAM_CHAT_ID: ${APROVADOR_TELEGRAM_CHAT_ID:-1000}
      GESTOR_TELEGRAM_CHAT_ID: ${GESTOR_TELEGRAM_CHAT_ID:-1000}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Vértice Cloud Atendimento <atendimento@vertice.example>}
      BASE_URL_PUBLICA: http://localhost:5678
    volumes:
      - n8n-data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./scripts:/scripts:ro

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  # Mocks de OpenAI e Telegram para testar o fluxo inteiro sem custo e sem credenciais reais.
  mock-apis:
    profiles: ["mock"]
    image: node:22-bookworm-slim
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes:
      - ./tests/mock-apis:/app:ro
    ports:
      - "4010:4010"

volumes:
  pgdata:
  n8n-data:
