# Stack de produção (Docker Swarm + Traefik) para o Portainer.
# Não contém segredos: todos os valores vêm de variáveis. No Portainer, em
# Stacks > Add stack > Web editor, cole este arquivo e em "Environment variables"
# use "Load variables from .env file" com o arquivo vps.env (veja vps.env.example).
services:
  db:
    # Postgres + esquema + dados de exemplo, publicado pelo GitHub Actions (.github/workflows/deploy.yml).
    # O esquema só é aplicado quando o volume nasce vazio.
    image: ghcr.io/gustavo9br/ai-operations-db:latest
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: n8n
      OPS_APP_PASSWORD: ${OPS_APP_PASSWORD:?defina OPS_APP_PASSWORD}
      OPS_MEMORIA_PASSWORD: ${OPS_MEMORIA_PASSWORD:?defina OPS_MEMORIA_PASSWORD}
    volumes:
      - aiops-pgdata:/var/lib/postgresql/data
    networks:
      - interna
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    environment:
      TZ: ${TZ:-America/Sao_Paulo}
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY}
      N8N_HOST: ${DOMINIO:-aiops.gustavomartins.dev}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://${DOMINIO:-aiops.gustavomartins.dev}/
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      # Os workflows leem os chat_ids e o remetente via $env.*; os segredos ficam em Credentials.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      # Retenção: execuções (que contêm dados de clientes) são apagadas após 14 dias.
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      APROVADOR_TELEGRAM_CHAT_ID: ${APROVADOR_TELEGRAM_CHAT_ID:-}
      GESTOR_TELEGRAM_CHAT_ID: ${GESTOR_TELEGRAM_CHAT_ID:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-Atendimento <atendimento@example.com>}
      BASE_URL_PUBLICA: https://${DOMINIO:-aiops.gustavomartins.dev}
    volumes:
      - aiops-n8n:/home/node/.n8n
    networks:
      - interna
      - externa
    deploy:
      replicas: 1 # modo "regular" do n8n: uma instância só
      restart_policy:
        condition: on-failure
      labels:
        - traefik.enable=true
        # Entradas públicas (formulário, webhook e telas de aprovação) com limite de taxa
        - traefik.http.routers.aiops-public.rule=Host(`${DOMINIO:-aiops.gustavomartins.dev}`) && (PathPrefix(`/form`) || PathPrefix(`/webhook`) || PathPrefix(`/form-waiting`) || PathPrefix(`/webhook-waiting`))
        - traefik.http.routers.aiops-public.entrypoints=websecure
        - traefik.http.routers.aiops-public.tls.certresolver=le
        - traefik.http.routers.aiops-public.priority=10
        - traefik.http.routers.aiops-public.middlewares=aiops-ratelimit
        - traefik.http.middlewares.aiops-ratelimit.ratelimit.average=30
        - traefik.http.middlewares.aiops-ratelimit.ratelimit.period=1m
        - traefik.http.middlewares.aiops-ratelimit.ratelimit.burst=15
        # Editor do n8n (protegido pelo login do dono)
        - traefik.http.routers.aiops-editor.rule=Host(`${DOMINIO:-aiops.gustavomartins.dev}`)
        - traefik.http.routers.aiops-editor.entrypoints=websecure
        - traefik.http.routers.aiops-editor.tls.certresolver=le
        - traefik.http.routers.aiops-editor.priority=1
        - traefik.http.services.aiops.loadbalancer.server.port=5678

volumes:
  aiops-pgdata:
  aiops-n8n:

networks:
  externa:
    external: true
  interna:
    driver: overlay
