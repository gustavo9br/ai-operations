name: Build & Publish DB Image

# Só a imagem do banco é construída aqui (Postgres + esquema + dados de exemplo).
# O n8n usa a imagem oficial; os workflows são importados a partir de /workflows.
on:
  push:
    branches: [main]
    paths: ["db/**", ".github/workflows/deploy.yml"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A arquitetura da VPS varia entre projetos; como o build é só COPY de arquivos
      # sobre a imagem oficial do Postgres, publicar as duas arquiteturas é barato.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push db
        uses: docker/build-push-action@v6
        with:
          context: ./db
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/ai-operations-db:latest
